<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codec Craft — WebM · GIF · APNG</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0f1117" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="zh-Hant" lang="zh-Hant">中</button>
          <button type="button" data-lang="en" lang="en">EN</button>
        </div>
        <h1>Codec Craft</h1>
        <p class="subtitle" data-i18n="subtitle"></p>
      </header>

      <nav class="pills-bar" aria-label="Conversions">
        <div class="pills-row" id="pills-row" role="tablist"></div>
      </nav>

      <div class="layout">
        <aside class="controls-pane">
          <section id="drop-zone" class="drop-zone">
            <p class="drop-title" data-i18n="drop_title"></p>
            <p class="muted" data-i18n="drop_hint"></p>
            <input id="file-input" type="file" accept="video/webm,image/gif,image/apng,image/png" multiple hidden />
          </section>

          <div id="edit-context" class="edit-context" hidden>
            <span class="edit-context-label" data-i18n="edit_context_label"></span>
            <span class="edit-context-pill"></span>
            <span class="edit-context-name"></span>
          </div>

          <section id="active-pill-controls" class="controls"></section>

          <section class="actions normal-actions">
            <button id="start-btn" disabled data-i18n="start_button"></button>
            <span id="load-status" class="muted"></span>
          </section>

          <section id="edit-actions" class="edit-actions sidebar-edit-actions" hidden>
            <button type="button" id="edit-overwrite-btn" class="edit-primary" data-i18n="edit_overwrite"></button>
            <button type="button" id="edit-duplicate-btn" class="edit-secondary" data-i18n="edit_duplicate"></button>
            <button type="button" id="edit-cancel-btn" class="edit-cancel" data-i18n="edit_cancel"></button>
          </section>

          <footer class="muted">
            <p data-i18n="footer"></p>
          </footer>
        </aside>

        <section class="results-pane">
          <h2 data-i18n="results_heading"></h2>
          <div id="results"></div>
        </section>
      </div>

      <footer class="page-footer">
        <p class="privacy" data-i18n="footer_privacy"></p>
        <nav class="links" aria-label="credits">
          <a href="https://github.com/howar31" target="_blank" rel="noopener">Howar31</a>
          <span class="sep" aria-hidden="true">·</span>
          <a href="https://github.com/howar31/codecraft" target="_blank" rel="noopener">GitHub</a>
          <span class="sep" aria-hidden="true">·</span>
          <a href="https://ko-fi.com/howar31" target="_blank" rel="noopener" class="support-link kofi-link">Ko-fi</a>
          <span class="sep" aria-hidden="true">·</span>
          <a href="https://donate.howar31.com" target="_blank" rel="noopener" class="support-link paypal-link">PayPal</a>
        </nav>
      </footer>

      <div id="drop-overlay" aria-hidden="true">
        <div class="drop-overlay-content">
          <p data-i18n="drop_overlay"></p>
        </div>
      </div>

      <div id="toast-host" aria-live="polite" aria-atomic="true"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
