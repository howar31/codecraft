<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codec Craft — WebM · GIF · APNG</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" data-lang="zh-Hant" lang="zh-Hant">中</button>
          <button type="button" data-lang="en" lang="en">EN</button>
        </div>
        <h1>Codec Craft</h1>
        <p class="subtitle" data-i18n="subtitle"></p>
      </header>

      <div class="layout">
        <aside class="controls-pane">
          <section id="drop-zone" class="drop-zone">
            <p data-i18n="drop_title"></p>
            <p class="muted" data-i18n="drop_hint"></p>
            <input id="file-input" type="file" accept="video/webm,image/gif,image/apng,image/png" multiple hidden />
          </section>

          <section class="controls">
            <label>
              <span data-i18n="label_fps"></span>
              <select id="fps">
                <option value="" data-i18n="opt_auto" selected></option>
                <option value="10">10</option>
                <option value="12">12</option>
                <option value="15">15</option>
                <option value="20">20</option>
                <option value="24">24</option>
                <option value="30">30</option>
                <option value="50">50</option>
              </select>
            </label>
            <label>
              <span data-i18n="label_width"></span>
              <select id="width">
                <option value="" data-i18n="opt_original" selected></option>
                <option value="240">240</option>
                <option value="320">320</option>
                <option value="480">480</option>
                <option value="640">640</option>
                <option value="800">800</option>
                <option value="1080">1080</option>
                <option value="1280">1280</option>
                <option value="1920">1920</option>
              </select>
            </label>
            <label class="checkbox">
              <span data-i18n="label_loop"></span>
              <input type="checkbox" id="loop" checked />
            </label>
            <div class="row">
              <span class="row-label" data-i18n="default_outputs_label" data-i18n-title="default_outputs_hint"></span>
              <div class="target-chips" id="default-output-chips" role="group">
                <button type="button" class="chip" data-default-target="webm">WebM</button>
                <button type="button" class="chip" data-default-target="apng">APNG</button>
              </div>
            </div>
            <fieldset>
              <legend data-i18n="quality_legend"></legend>
              <label>
                <input type="radio" name="quality" id="quality-high" value="high" checked />
                <span data-i18n="quality_high"></span>
              </label>
              <label>
                <input type="radio" name="quality" id="quality-normal" value="normal" />
                <span data-i18n="quality_normal"></span>
              </label>
            </fieldset>
          </section>

          <section class="actions">
            <button id="start-btn" disabled data-i18n="start_button"></button>
            <span id="load-status" class="muted"></span>
          </section>

          <footer class="muted">
            <p data-i18n="footer"></p>
          </footer>
        </aside>

        <section class="results-pane">
          <h2 data-i18n="results_heading"></h2>
          <div id="results"></div>
        </section>
      </div>

      <footer class="page-footer">
        <p class="privacy" data-i18n="footer_privacy"></p>
        <nav class="links" aria-label="credits">
          <a href="https://github.com/howar31" target="_blank" rel="noopener">Howar31</a>
          <span class="sep" aria-hidden="true">·</span>
          <a href="https://github.com/howar31/codecraft" target="_blank" rel="noopener">GitHub</a>
          <span class="sep" aria-hidden="true">·</span>
          <span class="sponsor-label" data-i18n="footer_sponsor"></span>
          <a href="https://ko-fi.com/howar31" target="_blank" rel="noopener" class="sponsor-link sponsor-kofi">Ko-fi</a>
          <span class="sep-tight" aria-hidden="true">·</span>
          <a href="https://donate.howar31.com" target="_blank" rel="noopener" class="sponsor-link sponsor-paypal">PayPal</a>
        </nav>
      </footer>

      <div id="drop-overlay" aria-hidden="true">
        <div class="drop-overlay-content">
          <p data-i18n="drop_overlay"></p>
        </div>
      </div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
